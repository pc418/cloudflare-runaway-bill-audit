name = "tidy-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.tidy.example", custom_domain = true },
]

[limits]
cpu_ms = 200

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 0.05

[ai]
binding = "AI"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[queues.producers]]
binding = "JOBS"
queue = "tidy-jobs"

[[queues.consumers]]
queue = "tidy-jobs"
max_batch_size = 10
max_retries = 3
max_concurrency = 2
dead_letter_queue = "tidy-jobs-dlq"

[[queues.consumers]]
queue = "tidy-jobs-dlq"
max_retries = 1

[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]
